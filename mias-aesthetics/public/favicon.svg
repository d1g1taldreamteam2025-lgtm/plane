<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f3d271"/>
      <stop offset="40%"  stop-color="#e8c878"/>
      <stop offset="70%"  stop-color="#d4a85a"/>
      <stop offset="100%" stop-color="#b88a36"/>
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f3d271"/>
      <stop offset="100%" stop-color="#b88a36"/>
    </linearGradient>
  </defs>

  <!-- Big hair flowing (fills most of the viewBox, transparent bg) -->
  <path d="M 26 112 C 8 84, 8 50, 32 22 C 46 6, 70 0, 88 8
           C 78 16, 70 26, 66 38
           C 74 36, 84 38, 90 42
           C 80 50, 72 60, 66 74
           C 70 80, 74 86, 72 92
           C 64 102, 54 110, 48 120
           C 58 122, 64 120, 68 116
           C 60 124, 48 126, 36 124 Z"
        fill="url(#hair-grad)"/>

  <!-- Inner hair shading -->
  <path d="M 40 116 C 36 100, 36 84, 46 70" stroke="#9a6e54" stroke-width="1.6" fill="none" opacity="0.55"/>
  <path d="M 52 118 C 50 104, 50 92, 56 84" stroke="#9a6e54" stroke-width="1.6" fill="none" opacity="0.45"/>

  <!-- Face profile (looking right, large) -->
  <path d="M 56 42
           C 60 32, 70 28, 78 30
           C 86 32, 92 38, 92 50
           L 96 64
           C 96 68, 94 70, 92 70
           C 92 74, 94 78, 92 80
           C 90 82, 88 82, 86 82
           C 86 88, 84 92, 80 96
           L 84 102
           C 84 106, 82 108, 78 110
           L 76 116
           C 72 120, 68 122, 64 124
           L 64 116
           C 62 110, 58 102, 56 92
           Z"
        fill="url(#gold)"/>

  <!-- Eyelash hint -->
  <path d="M 80 54 C 82 52, 85 52, 88 54" stroke="#1a0f1f" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Crown on top — large, centered on the head -->
  <g transform="translate(70 18)">
    <path d="M -22 10 L -16 -4 L -10 6 L 0 -10 L 10 6 L 16 -4 L 22 10 Z"
          fill="url(#gold)" stroke="#9a6e54" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="-22" y="10" width="44" height="5" rx="1.5" fill="url(#gold)" stroke="#9a6e54" stroke-width="0.8"/>
    <circle cx="-16" cy="-4" r="2.5" fill="#fff" stroke="#9a6e54" stroke-width="0.8"/>
    <circle cx="0"   cy="-10" r="3.5" fill="#fff" stroke="#9a6e54" stroke-width="0.8"/>
    <circle cx="16"  cy="-4" r="2.5" fill="#fff" stroke="#9a6e54" stroke-width="0.8"/>
  </g>
</svg>
