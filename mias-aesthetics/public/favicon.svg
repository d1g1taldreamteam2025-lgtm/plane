<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="50%" stop-color="#d4a85a"/>
      <stop offset="100%" stop-color="#b88a36"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc6dd"/>
      <stop offset="100%" stop-color="#ec6f9c"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="16" fill="#1a0f1f"/>
  <!-- Crown -->
  <g transform="translate(32 14)" fill="url(#g)">
    <path d="M -12 0 L -8 -10 L -4 -2 L 0 -12 L 4 -2 L 8 -10 L 12 0 Z"/>
    <rect x="-12" y="0" width="24" height="3" rx="1"/>
    <circle cx="-8" cy="-10" r="1.6"/>
    <circle cx="0"  cy="-12" r="2"/>
    <circle cx="8"  cy="-10" r="1.6"/>
  </g>
  <!-- M Mia -->
  <text x="32" y="50" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28" font-weight="700" font-style="italic"
        fill="url(#g)">M</text>
  <!-- Pink dot accent -->
  <circle cx="48" cy="50" r="2.5" fill="url(#r)"/>
</svg>
