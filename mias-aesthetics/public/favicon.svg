<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#f4d572"/>
      <stop offset="40%"  stop-color="#e8c878"/>
      <stop offset="70%"  stop-color="#d4a85a"/>
      <stop offset="100%" stop-color="#a07628"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ec6f9c"/>
      <stop offset="100%" stop-color="#a83861"/>
    </linearGradient>
  </defs>

  <!-- Round dark background — high contrast on light AND dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="#1a0f1f"/>

  <!-- Big bold crown on top -->
  <g transform="translate(32 14)" fill="url(#gold)" stroke="#1a0f1f" stroke-width="0.6">
    <path d="M -19 9 L -13 -4 L -7 6 L 0 -9 L 7 6 L 13 -4 L 19 9 Z" stroke-linejoin="round"/>
    <rect x="-19" y="9" width="38" height="5" rx="1.5"/>
    <circle cx="-13" cy="-4" r="3"/>
    <circle cx="0"   cy="-9" r="4"/>
    <circle cx="13"  cy="-4" r="3"/>
  </g>

  <!-- Bold italic M (Mia) in gold below the crown -->
  <text x="32" y="50"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-weight="900"
        font-style="italic"
        fill="url(#gold)"
        stroke="#1a0f1f"
        stroke-width="0.8"
        paint-order="stroke">M</text>

  <!-- Pink accent dot -->
  <circle cx="50" cy="50" r="3" fill="url(#pink)"/>
</svg>
